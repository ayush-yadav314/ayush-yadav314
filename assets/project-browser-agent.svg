<svg xmlns="http://www.w3.org/2000/svg" width="480" height="376" viewBox="0 0 480 376" role="img"><defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f7ff"/><stop offset=".55" stop-color="#7c3aed" stop-opacity=".9"/><stop offset="1" stop-color="#2f6bff" stop-opacity=".6"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset=".5" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
<radialGradient id="rg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00f7ff" stop-opacity=".30"/><stop offset="1" stop-color="#00f7ff" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect x="2" y="2" width="476" height="372" rx="20"/></clipPath></defs><style></style><g clip-path="url(#cc)"><rect width="480" height="376" fill="#080b17"/><circle cx="440" cy="30" r="170" fill="url(#rg)"/><circle cx="20" cy="376" r="130" fill="url(#rg)" opacity=".5"/><rect width="480" height="376" fill="url(#gl)"/><rect x="0" y="-3" width="480" height="2" fill="#00f7ff" opacity=".5"><animate attributeName="y" values="-3;376" dur="7s" repeatCount="indefinite"/></rect></g><rect x="2" y="2" width="476" height="372" rx="20" fill="none" stroke="url(#bd)" stroke-width="1.6"/><text x="26" y="40" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" font-weight="700" fill="#00f7ff" letter-spacing="2.5">01 // BROWSER AGENT</text><circle cx="394" cy="36" r="4.5" fill="#a855f7"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="406" y="40" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" font-weight="700" fill="#a855f7" letter-spacing="2">LOCAL</text><text x="26" y="80" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#f5f8ff">Autonomous Browser Agent</text><text x="26" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.2" fill="#9fb0cc">Turns a plain-English goal into real browser actions,</text><text x="26" y="125" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.2" fill="#9fb0cc">decided step by step by a local LLM. Free and offline.</text><rect x="26" y="148" width="428" height="1" fill="#1d2a4d"/><rect x="26" y="164" width="6" height="6" fill="#00f7ff" transform="rotate(45 29 167)"/><text x="42" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.8" fill="#d3def2">Observe &gt; Decide &gt; Execute &gt; Verify loop</text><rect x="26" y="186" width="6" height="6" fill="#00f7ff" transform="rotate(45 29 189)"/><text x="42" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.8" fill="#d3def2">Code-verified completion, not LLM self-check</text><rect x="26" y="208" width="6" height="6" fill="#00f7ff" transform="rotate(45 29 211)"/><text x="42" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.8" fill="#d3def2">Tested on DuckDuckGo, Wikipedia, Amazon.in</text><rect x="26" y="230" width="6" height="6" fill="#00f7ff" transform="rotate(45 29 233)"/><text x="42" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.8" fill="#d3def2">Page simplified to numbered elements for Phi-3</text><rect x="26" y="268" width="61.4" height="22" rx="11" fill="#00f7ff" fill-opacity=".10" stroke="#00f7ff" stroke-opacity=".55"/><text x="56.7" y="283" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#e8f1ff">Python</text><rect x="95.4" y="268" width="61.4" height="22" rx="11" fill="#00f7ff" fill-opacity=".10" stroke="#00f7ff" stroke-opacity=".55"/><text x="126.1" y="283" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#e8f1ff">Ollama</text><rect x="164.8" y="268" width="89.0" height="22" rx="11" fill="#00f7ff" fill-opacity=".10" stroke="#00f7ff" stroke-opacity=".55"/><text x="209.3" y="283" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#e8f1ff">Phi-3 Mini</text><rect x="261.8" y="268" width="89.0" height="22" rx="11" fill="#00f7ff" fill-opacity=".10" stroke="#00f7ff" stroke-opacity=".55"/><text x="306.3" y="283" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#e8f1ff">Playwright</text><rect x="358.8" y="268" width="82.1" height="22" rx="11" fill="#00f7ff" fill-opacity=".10" stroke="#00f7ff" stroke-opacity=".55"/><text x="399.9" y="283" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#e8f1ff">Streamlit</text><text x="26" y="358" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10.8" fill="#6f84ad">&gt; github.com/ayush-yadav314/autonomous-browser-agent</text></svg>